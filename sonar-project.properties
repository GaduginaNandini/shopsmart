sonar.projectKey=shopsmart
sonar.projectName=ShopSmart
sonar.projectVersion=1.0.0
sonar.sources=server.ts,src
sonar.tests=tests
sonar.exclusions=public/**,node_modules/**,drizzle/**,coverage/**,selenium_tests/**,loadtest/**,docs/**,postman/**,monitoring/**
sonar.test.inclusions=tests/**/*.test.ts
sonar.coverage.exclusions=src/client/**,src/db/index.ts,src/db/drizzle.config.ts,src/lib/firebase-admin.ts,tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
