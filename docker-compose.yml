services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shopsmart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shopsmart"]
      interval: 5s
      retries: 10
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SQL_HOST: db
      SQL_PORT: 5432
      SQL_DB_NAME: shopsmart
      SQL_USER: shop
      SQL_PASSWORD: shop
      SQL_ADMIN_USER: shop
      SQL_ADMIN_PASSWORD: shop
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OWNER_TOKEN: ${OWNER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
